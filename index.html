<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ClientForge — AI automations, apps & websites that grow your business</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          primary: '#DEDBC8',
          ink: '#E1E0CC',
          gold: '#E3B65C',
          void: '#1B2836',
          surface: '#223546',
          card: '#2C4157',
        },
        fontFamily: {
          sans: ['Almarai', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          // `serif` is aliased to the pixel face so every existing
          // `font-serif` usage picks up the pixel theme automatically.
          serif: ['"Pixelify Sans"', 'ui-monospace', 'monospace'],
          pixel: ['"Pixelify Sans"', 'ui-monospace', 'monospace'],
        },
        letterSpacing: {
          tightest: '-0.07em',
        },
      }
    }
  };
</script>

<link rel="icon" type="image/png" href="assets/logo/favicon.png" />
<link rel="apple-touch-icon" href="assets/logo/clientforge-mark.png" />

<link rel="stylesheet" href="styles.css" />

<!-- The landing frame — first frame of leg1, what the visitor sees before a
     single byte of video has decoded. Preloaded so it never paints late. -->
<link rel="preload" as="image" href="assets/hero/start-city.png" />

<!-- Production React. The development builds ship extra warning machinery and
     run markedly slower; nothing here needs them at runtime. @babel/standalone
     is gone entirely — JSX is precompiled to app/build/ by `npm run build`, so
     visitors no longer download and run a compiler on every page load. -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="https://unpkg.com/framer-motion@11.3.19/dist/framer-motion.js" integrity="sha384-y/MdSCrb4GkhS61dPaT0NBzcfVklpAb/7lgbSu8l8N7RudKwl7/+blwqgUHRiikE" crossorigin="anonymous"></script>
</head>
<body class="bg-void text-ink antialiased scanlines">

<!-- The scroll world owns the top of the page. It builds its own DOM, so it
     lives outside the React root rather than inside a component. -->
<div id="world"></div>

<div id="root"></div>

<script src="app/scrub-engine.js"></script>
<script src="app/world.js"></script>

<script src="app/build/icons.js"></script>
<script src="app/build/motionPrimitives.js"></script>
<script src="app/build/checkout.js"></script>
<script src="app/build/pricing.js"></script>
<script src="app/build/work.js"></script>
<script src="app/build/testimonials.js"></script>
<script src="app/build/contact.js"></script>
<script src="app/build/app.js"></script>

</body>
</html>
