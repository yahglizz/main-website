<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ClientForge — AI automations, apps & websites that grow your business</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          primary: '#DEDBC8',
          ink: '#E1E0CC',
          gold: '#E3B65C',
          void: '#1B2836',
          surface: '#223546',
          card: '#2C4157',
        },
        fontFamily: {
          sans: ['Almarai', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          // `serif` is aliased to the pixel face so every existing
          // `font-serif` usage picks up the pixel theme automatically.
          serif: ['"Pixelify Sans"', 'ui-monospace', 'monospace'],
          pixel: ['"Pixelify Sans"', 'ui-monospace', 'monospace'],
        },
        letterSpacing: {
          tightest: '-0.07em',
        },
      }
    }
  };
</script>

<link rel="icon" type="image/png" href="assets/logo/favicon.png" />
<link rel="apple-touch-icon" href="assets/logo/clientforge-mark.png" />

<link rel="stylesheet" href="styles.css" />

<!-- The landing frame — first frame of leg1, what the visitor sees before a
     single byte of video has decoded. Preloaded so it never paints late. -->
<link rel="preload" as="image" href="assets/hero/start-city.png" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/framer-motion@11.3.19/dist/framer-motion.js"></script>
</head>
<body class="bg-void text-ink antialiased scanlines">
